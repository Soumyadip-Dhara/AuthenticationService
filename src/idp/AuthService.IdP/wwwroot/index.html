<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Auth Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <script src="/js/theme.js"></script>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 2rem;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 2.5rem;
            box-shadow: var(--shadow-lg);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--primary-bg);
            border-radius: var(--border-radius);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.1);
        }

        .logo-icon svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        .logo p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 0.375rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--border-radius);
            color: var(--text-main);
            font-size: 0.9375rem;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }

        .form-group input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .form-group input.otp-digit-input {
            width: 48px;
            height: 54px;
            padding: 0;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .captcha-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .captcha-image {
            height: 44px;
            width: 130px;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            background: #f8fafc;
            display: block;
        }

        .captcha-refresh {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            color: var(--text-muted);
            height: 44px;
            width: 44px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .captcha-refresh:hover {
            background: #e2e8f0;
            color: var(--text-main);
        }

        .error-message {
            display: none;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: var(--border-radius);
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            color: var(--error-text);
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .error-message.visible {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary-bg);
            border: 1px solid var(--primary-bg);
            border-radius: var(--border-radius);
            color: var(--primary-text);
            font-size: 0.9375rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 0.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 44px;
        }

        .submit-btn:hover:not(:disabled) {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .submit-btn.loading .btn-text {
            display: none;
        }

        .submit-btn.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .auth-method-group {
            display: flex;
            gap: 1.5rem;
            margin-top: 0.25rem;
            padding: 0.75rem;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
        }

        .auth-method-option {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            color: var(--text-main);
            user-select: none;
        }

        .auth-method-option input[type="radio"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-bg);
            cursor: pointer;
            margin: 0;
        }

        .otp-inputs {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin: 1.25rem 0;
        }

        .form-info-text {
            font-size: 0.8125rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 1rem;
        }

        .back-link {
            display: block;
            background: transparent;
            border: none;
            color: var(--text-muted);
            margin-top: 1rem;
            width: 100%;
            text-align: center;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--text-main);
        }

        .totp-qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 1.5rem 0;
            background: #f8fafc;
            border-radius: var(--border-radius);
            padding: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .totp-qr-image {
            width: 160px;
            height: 160px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            background: white;
            padding: 4px;
        }

        .totp-secret-box {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 0.5rem 0.75rem;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
            text-align: center;
            width: 100%;
            user-select: all;
            margin-bottom: 0.5rem;
        }

        .totp-secret-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                    </svg>
                </div>
                <h1>Auth Service</h1>
                <p>Sign in to your account</p>
            </div>

            <div id="error" class="error-message"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="admin@demo.com" required autocomplete="email" autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div class="form-group">
                    <label>Security Verification</label>
                    <div class="captcha-container">
                        <img id="captchaImage" class="captcha-image" src="/Account/Captcha" alt="CAPTCHA" />
                        <button type="button" class="captcha-refresh" onclick="refreshCaptcha()" title="Refresh Captcha">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                        </button>
                    </div>
                    <input type="text" id="captcha" name="captcha" placeholder="Enter characters above" required autocomplete="off" style="text-transform: uppercase;">
                </div>

                <div class="form-group" style="margin-bottom: 2rem;">
                    <label>2FA Verification Method</label>
                    <div class="auth-method-group">
                        <label class="auth-method-option">
                            <input type="radio" name="authMethod" value="Normal" checked />
                            Email OTP
                        </label>
                        <label class="auth-method-option">
                            <input type="radio" name="authMethod" value="Totp" />
                            Authenticator App
                        </label>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">
                    <span class="btn-text">Sign In</span>
                    <div class="spinner"></div>
                </button>
            </form>

            <form id="otpForm" onsubmit="handleVerifyOtp(event)" style="display: none;">
                <div class="form-group">
                    <label style="text-align: center;">One-Time Password (OTP)</label>
                    <p class="form-info-text">A 6-digit code has been sent to your email.</p>
                    <div class="otp-inputs">
                        <input type="text" class="otp-digit-input otp-box-normal" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-digit-input otp-box-normal" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-digit-input otp-box-normal" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-digit-input otp-box-normal" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-digit-input otp-box-normal" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-digit-input otp-box-normal" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                    </div>
                </div>

                <div id="otpSpinner" style="display: none; justify-content: center; margin: 15px 0;">
                    <div class="spinner" style="display: block; border-color: rgba(15,23,42,0.2); border-top-color: var(--primary-bg);"></div>
                </div>
                
                <button type="button" class="back-link" onclick="backToLogin()">← Back to Login</button>
            </form>

            <form id="totpSetupForm" onsubmit="handleVerifyTotpSetup(event)" style="display: none;">
                <div class="form-group">
                    <p class="form-info-text" style="margin-bottom: 0;">
                        Scan this QR code with your authenticator app.
                    </p>
                    <div class="totp-qr-container">
                        <img id="totpQrImage" class="totp-qr-image" src="" alt="Scan QR Code" />
                        <div class="totp-secret-box" id="totpSecretText"></div>
                        <div class="totp-secret-label">Secret Key</div>
                    </div>
                </div>

                <div class="form-group">
                    <label style="text-align: center;">Enter Verification Code</label>
                    <div class="otp-inputs">
                        <input type="text" class="otp-digit-input otp-box-setup" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-digit-input otp-box-setup" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-digit-input otp-box-setup" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-digit-input otp-box-setup" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-digit-input otp-box-setup" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-digit-input otp-box-setup" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                    </div>
                </div>

                <div id="totpSetupSpinner" style="display: none; justify-content: center; margin: 15px 0;">
                    <div class="spinner" style="display: block; border-color: rgba(15,23,42,0.2); border-top-color: var(--primary-bg);"></div>
                </div>

                <button type="button" class="back-link" onclick="backToLogin()">← Back to Login</button>
            </form>

            <form id="totpVerifyForm" onsubmit="handleVerifyTotp(event)" style="display: none;">
                <div class="form-group">
                    <label style="text-align: center;">Authenticator Code</label>
                    <p class="form-info-text">Enter the 6-digit code from your app.</p>
                    <div class="otp-inputs">
                        <input type="text" class="otp-digit-input otp-box-verify" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-digit-input otp-box-verify" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-digit-input otp-box-verify" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-digit-input otp-box-verify" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-digit-input otp-box-verify" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-digit-input otp-box-verify" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                    </div>
                </div>

                <div id="totpVerifySpinner" style="display: none; justify-content: center; margin: 15px 0;">
                    <div class="spinner" style="display: block; border-color: rgba(15,23,42,0.2); border-top-color: var(--primary-bg);"></div>
                </div>

                <button type="button" class="back-link" onclick="backToLogin()">← Back to Login</button>
            </form>

            <div class="footer">
                <p>Identity Provider Service</p>
                <div class="theme-picker-container" style="margin-top: 1rem;">
                    <div class="theme-swatch slate" data-theme="slate" onclick="setTheme('slate')" title="Slate"></div>
                    <div class="theme-swatch blue" data-theme="blue" onclick="setTheme('blue')" title="Blue"></div>
                    <div class="theme-swatch emerald" data-theme="emerald" onclick="setTheme('emerald')" title="Emerald"></div>
                    <div class="theme-swatch indigo" data-theme="indigo" onclick="setTheme('indigo')" title="Indigo"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Extract returnUrl from query string
        function getReturnUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('ReturnUrl') || params.get('returnUrl') || '/';
        }

        function refreshCaptcha() {
            const captchaImage = document.getElementById('captchaImage');
            captchaImage.src = '/Account/Captcha?t=' + new Date().getTime();
            document.getElementById('captcha').value = '';
        }

        function backToLogin() {
            document.getElementById('otpForm').style.display = 'none';
            document.getElementById('totpSetupForm').style.display = 'none';
            document.getElementById('totpVerifyForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('error').classList.remove('visible');
            refreshCaptcha();
        }

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const captcha = document.getElementById('captcha').value;
            const authMethod = document.querySelector('input[name="authMethod"]:checked').value;
            const errorEl = document.getElementById('error');
            const submitBtn = document.getElementById('submitBtn');

            // Reset error state
            errorEl.classList.remove('visible');
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            try {
                const response = await fetch('/Account/LoginApi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        captcha: captcha,
                        authMethod: authMethod,
                        returnUrl: getReturnUrl()
                    }),
                    credentials: 'include'
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.requiresOtp) {
                        // Switch to the correct form
                        document.getElementById('loginForm').style.display = 'none';
                        if (data.authMethod === 'Totp') {
                            if (data.setupTotp) {
                                document.getElementById('totpSetupForm').style.display = 'block';
                                document.getElementById('totpQrImage').src = 'https://api.qrserver.com/v1/create-qr-code/?size=160x160&margin=0&data=' + encodeURIComponent(data.qrCodeUrl);
                                document.getElementById('totpSecretText').textContent = data.secret;
                                
                                document.querySelectorAll('.otp-box-setup').forEach(inp => inp.value = '');
                                document.querySelectorAll('.otp-box-setup')[0].focus();
                            } else {
                                document.getElementById('totpVerifyForm').style.display = 'block';
                                
                                document.querySelectorAll('.otp-box-verify').forEach(inp => inp.value = '');
                                document.querySelectorAll('.otp-box-verify')[0].focus();
                            }
                        } else {
                            document.getElementById('otpForm').style.display = 'block';
                            
                            document.querySelectorAll('.otp-box-normal').forEach(inp => inp.value = '');
                            document.querySelectorAll('.otp-box-normal')[0].focus();
                        }
                    } else {
                        // Redirect back to the authorize endpoint
                        window.location.href = data.returnUrl || '/';
                    }
                } else {
                    const data = await response.json().catch(() => ({}));
                    errorEl.textContent = data.error || 'Invalid email, password, or CAPTCHA.';
                    errorEl.classList.add('visible');
                    refreshCaptcha();
                }
            } catch (err) {
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.classList.add('visible');
                refreshCaptcha();
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        }

        function setupOtpInputGroup(selector, submitCallback) {
            const inputs = document.querySelectorAll(selector);
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value && !/^[0-9]$/.test(e.target.value)) {
                        e.target.value = '';
                        return;
                    }
                    if (e.target.value && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                    
                    const otp = Array.from(inputs).map(inp => inp.value).join('');
                    if (otp.length === 6) {
                        submitCallback(otp);
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace') {
                        if (!e.target.value && index > 0) {
                            inputs[index - 1].focus();
                            inputs[index - 1].value = '';
                        } else {
                            e.target.value = '';
                        }
                        e.preventDefault();
                    }
                });

                input.addEventListener('paste', (e) => {
                    const data = (e.clipboardData || window.clipboardData).getData('text').trim();
                    if (/^[0-9]{6}$/.test(data)) {
                        inputs.forEach((inp, idx) => {
                            inp.value = data[idx];
                        });
                        inputs[inputs.length - 1].focus();
                        submitCallback(data);
                    }
                    e.preventDefault();
                });
            });
        }

        async function submitOtp(otp) {
            const errorEl = document.getElementById('error');
            const otpSpinner = document.getElementById('otpSpinner');

            // Reset error state
            errorEl.classList.remove('visible');
            otpSpinner.style.display = 'flex';

            try {
                const response = await fetch('/Account/VerifyOtpApi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ otp: otp }),
                    credentials: 'include'
                });

                if (response.ok) {
                    const data = await response.json();
                    window.location.href = data.returnUrl || '/';
                } else {
                    const data = await response.json().catch(() => ({}));
                    errorEl.textContent = data.error || 'Invalid or expired OTP.';
                    errorEl.classList.add('visible');
                    document.querySelectorAll('.otp-box-normal').forEach(inp => inp.value = '');
                    document.querySelectorAll('.otp-box-normal')[0].focus();
                }
            } catch (err) {
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.classList.add('visible');
            } finally {
                otpSpinner.style.display = 'none';
            }
        }

        async function submitTotpSetup(code) {
            const errorEl = document.getElementById('error');
            const setupSpinner = document.getElementById('totpSetupSpinner');

            errorEl.classList.remove('visible');
            setupSpinner.style.display = 'flex';

            try {
                const response = await fetch('/Account/VerifyTotpSetupApi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code }),
                    credentials: 'include'
                });

                if (response.ok) {
                    const data = await response.json();
                    window.location.href = data.returnUrl || '/';
                } else {
                    const data = await response.json().catch(() => ({}));
                    errorEl.textContent = data.error || 'Invalid TOTP verification code.';
                    errorEl.classList.add('visible');
                    document.querySelectorAll('.otp-box-setup').forEach(inp => inp.value = '');
                    document.querySelectorAll('.otp-box-setup')[0].focus();
                }
            } catch (err) {
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.classList.add('visible');
            } finally {
                setupSpinner.style.display = 'none';
            }
        }

        async function submitTotpVerify(otp) {
            const errorEl = document.getElementById('error');
            const verifySpinner = document.getElementById('totpVerifySpinner');

            errorEl.classList.remove('visible');
            verifySpinner.style.display = 'flex';

            try {
                const response = await fetch('/Account/VerifyOtpApi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ otp: otp }),
                    credentials: 'include'
                });

                if (response.ok) {
                    const data = await response.json();
                    window.location.href = data.returnUrl || '/';
                } else {
                    const data = await response.json().catch(() => ({}));
                    errorEl.textContent = data.error || 'Invalid or expired verification code.';
                    errorEl.classList.add('visible');
                    document.querySelectorAll('.otp-box-verify').forEach(inp => inp.value = '');
                    document.querySelectorAll('.otp-box-verify')[0].focus();
                }
            } catch (err) {
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.classList.add('visible');
            } finally {
                verifySpinner.style.display = 'none';
            }
        }

        // Initialize inputs on load
        window.addEventListener('DOMContentLoaded', () => {
            setupOtpInputGroup('.otp-box-normal', submitOtp);
            setupOtpInputGroup('.otp-box-setup', submitTotpSetup);
            setupOtpInputGroup('.otp-box-verify', submitTotpVerify);
        });
    </script>
</body>
</html>
