<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Auth Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #e0e0e0;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        }

        .logo-icon svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .logo p {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 0.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.9375rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-group input.otp-box {
            width: 44px;
            height: 48px;
            padding: 0;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 10px;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .error-message {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.25rem;
            font-size: 0.8125rem;
            color: #fca5a5;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .error-message.visible {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 0.8125rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 0.9375rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .submit-btn .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        .submit-btn.loading .btn-text {
            display: none;
        }

        .submit-btn.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
        }

        .footer a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                    </svg>
                </div>
                <h1>Auth Service</h1>
                <p>Sign in to continue</p>
            </div>

            <div id="error" class="error-message"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="admin@demo.com" required autocomplete="email" autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <div class="form-group">
                    <label>Security Verification</label>
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
                        <img id="captchaImage" src="/Account/Captcha" alt="CAPTCHA" style="border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); height: 42px; width: 130px; display: block;" />
                        <button type="button" onclick="refreshCaptcha()" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; height: 42px; width: 42px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;" title="Refresh Captcha">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                        </button>
                    </div>
                    <input type="text" id="captcha" name="captcha" placeholder="Enter security code" required autocomplete="off" style="text-transform: uppercase;">
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">
                    <span class="btn-text">Sign In</span>
                    <div class="spinner"></div>
                </button>
            </form>

            <form id="otpForm" onsubmit="handleVerifyOtp(event)" style="display: none;">
                <div class="form-group">
                    <label>One-Time Password (OTP)</label>
                    <p style="font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-bottom: 15px; line-height: 1.4;">A 6-digit verification code has been generated and printed to the server logs.</p>
                    <div class="otp-inputs" style="display: flex; gap: 8px; justify-content: center; margin: 15px 0;">
                        <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                        <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
                    </div>
                </div>

                <div id="otpSpinner" style="display: none; justify-content: center; margin: 15px 0;">
                    <div class="spinner" style="display: block; width: 24px; height: 24px; border: 2px solid rgba(255, 255, 255, 0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite;"></div>
                </div>
                
                <button type="button" onclick="backToLogin()" style="background: transparent; border: none; color: rgba(255,255,255,0.5); margin-top: 15px; width: 100%; text-align: center; cursor: pointer; font-size: 0.85rem; text-decoration: underline;">
                    Back to Login
                </button>
            </form>

            <div class="footer">
                <p>OpenID Connect Identity Provider</p>
            </div>
        </div>
    </div>

    <script>
        // Extract returnUrl from query string
        function getReturnUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('ReturnUrl') || params.get('returnUrl') || '/';
        }

        function refreshCaptcha() {
            const captchaImage = document.getElementById('captchaImage');
            captchaImage.src = '/Account/Captcha?t=' + new Date().getTime();
            document.getElementById('captcha').value = '';
        }

        function backToLogin() {
            document.getElementById('otpForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('error').classList.remove('visible');
            refreshCaptcha();
        }

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const captcha = document.getElementById('captcha').value;
            const errorEl = document.getElementById('error');
            const submitBtn = document.getElementById('submitBtn');

            // Reset error state
            errorEl.classList.remove('visible');
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            try {
                const response = await fetch('/Account/LoginApi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        captcha: captcha,
                        returnUrl: getReturnUrl()
                    }),
                    credentials: 'include'
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.requiresOtp) {
                        // Switch to OTP form
                        document.getElementById('loginForm').style.display = 'none';
                        document.getElementById('otpForm').style.display = 'block';
                        
                        // Setup the 6 boxes and focus the first one
                        setupOtpInputs();
                        document.querySelectorAll('.otp-box').forEach(inp => inp.value = '');
                        document.querySelectorAll('.otp-box')[0].focus();
                    } else {
                        // Redirect back to the authorize endpoint
                        window.location.href = data.returnUrl || '/';
                    }
                } else {
                    const data = await response.json().catch(() => ({}));
                    errorEl.textContent = data.error || 'Invalid email, password, or CAPTCHA.';
                    errorEl.classList.add('visible');
                    refreshCaptcha();
                }
            } catch (err) {
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.classList.add('visible');
                refreshCaptcha();
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        }

        function getOtpValue() {
            let otp = '';
            document.querySelectorAll('.otp-box').forEach(inp => {
                otp += inp.value;
            });
            return otp;
        }

        function setupOtpInputs() {
            const inputs = document.querySelectorAll('.otp-box');
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value && !/^[0-9]$/.test(e.target.value)) {
                        e.target.value = '';
                        return;
                    }
                    if (e.target.value && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                    
                    const otp = getOtpValue();
                    if (otp.length === 6) {
                        submitOtp(otp);
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace') {
                        if (!e.target.value && index > 0) {
                            inputs[index - 1].focus();
                            inputs[index - 1].value = '';
                        } else {
                            e.target.value = '';
                        }
                        e.preventDefault();
                    }
                });

                input.addEventListener('paste', (e) => {
                    const data = (e.clipboardData || window.clipboardData).getData('text');
                    if (/^[0-9]{6}$/.test(data)) {
                        inputs.forEach((inp, idx) => {
                            inp.value = data[idx];
                        });
                        inputs[inputs.length - 1].focus();
                        submitOtp(data);
                    }
                    e.preventDefault();
                });
            });
        }

        async function submitOtp(otp) {
            const errorEl = document.getElementById('error');
            const otpSpinner = document.getElementById('otpSpinner');

            // Reset error state
            errorEl.classList.remove('visible');
            otpSpinner.style.display = 'flex';

            try {
                const response = await fetch('/Account/VerifyOtpApi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        otp: otp
                    }),
                    credentials: 'include'
                });

                if (response.ok) {
                    const data = await response.json();
                    window.location.href = data.returnUrl || '/';
                } else {
                    const data = await response.json().catch(() => ({}));
                    errorEl.textContent = data.error || 'Invalid or expired OTP.';
                    errorEl.classList.add('visible');
                    // Clear inputs on failure to allow re-entry
                    document.querySelectorAll('.otp-box').forEach(inp => inp.value = '');
                    document.querySelectorAll('.otp-box')[0].focus();
                }
            } catch (err) {
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.classList.add('visible');
            } finally {
                otpSpinner.style.display = 'none';
            }
        }

        async function handleVerifyOtp(event) {
            event.preventDefault();
            const otp = getOtpValue();
            if (otp.length === 6) {
                await submitOtp(otp);
            }
        }

        // Initialize inputs on load
        window.addEventListener('DOMContentLoaded', () => {
            setupOtpInputs();
        });
    </script>
</body>
</html>
